name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://sales:ci-only-password@127.0.0.1:5432/sales_analytics
      TELEGRAM_ENABLED: "false"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sales
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sales_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sales -d sales_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Lint backend
        run: python -m ruff check backend
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
